name: 发布云端试玩

# 用户已指定：以后试玩直接通过云端网址交付。
# 开发分支是当前 Demo 的发布源；首次在 Settings → Pages 选择 GitHub Actions。
on:
  push:
    branches: [codex/jianghu-sandbox-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/jianghu-sandbox-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: 准备浏览器
        run: command -v google-chrome || npx playwright install --with-deps chromium
      - name: 验证界面选择与旧网址迁移
        env:
          SMOKE_CHANNEL: chrome
        run: node scripts/entry-smoke.mjs
      - name: 验证同屏行动与手机连续操作
        env:
          SMOKE_CHANNEL: chrome
        run: |
          node scripts/room-smoke.mjs
          node scripts/room-combat-smoke.mjs
      - name: 验证三种手机操作与玩法
        env:
          SMOKE_CHANNEL: chrome
        run: |
          node scripts/ux-smoke.mjs
          node scripts/demo-smoke.mjs
      - name: 记录发布版本
        run: node -e 'require("node:fs").writeFileSync("dist/version.json", JSON.stringify({commit:process.env.GITHUB_SHA}))'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
