<title>扬州试玩版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;family=Zhi+Mang+Xing&amp;display=swap">
<style>
/* Layout: one phone-width column — app bar, a scrolling stack of white cards, bottom tabs; combat is a full-height layer inside the same column */
:root{
  --bg:#F1F3F4; --card:#FFFFFF; --fg:#14171A; --muted:#5B636A; --line:#E2E5E8; --chip:#EEF1F3;
  --accent:#0F7A63; --accent-soft:#E1F1EC; --on-accent:#FFFFFF;
  --danger:#B8321C; --danger-fill:#D2462E; --danger-soft:#FBE8E3; --on-danger:#FFFFFF; --opp:#F3C6BC;
  --hp:#D2462E; --hp-soft:#F6DDD8;
  --info:#2E5BCE; --info-soft:#DCE5F8;
  --warn:#8A5A06; --warn-soft:#FFF5E1; --warn-line:#E8BE72; --warn-dot:#C98A12;
  --t-red-bg:#FBE7E3; --t-red:#B4432B; --t-jade-bg:#E1F1EC; --t-jade:#0F7A63; --t-amber-bg:#FDEBD3; --t-amber:#94560E;
  --t-gray-bg:#ECEEF1; --t-gray:#5B636A; --t-blue-bg:#DCE5F8; --t-blue:#2E5BCE; --t-purple-bg:#ECE5F8; --t-purple:#6B4FB8;
  --g-fan:#6B7177; --g-liang:#2F8A4C; --g-shang:#2E5BCE; --g-jue:#7A4BC2; --g-shen:#A06D08; --g-jin:#A3261A;
  --shadow:0 -6px 20px rgba(20,23,26,.06); --lift:0 8px 24px rgba(20,23,26,.16); --scrim:rgba(20,23,26,.42);
  --ult-bg:rgba(241,243,244,.95); --ult-ink:#14171A;
  --f-sans:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --f-serif:'Noto Serif SC','Songti SC','STSong',serif;
  --f-brush:'Zhi Mang Xing','STXingkai','KaiTi',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113; --card:#191D20; --fg:#ECEFF1; --muted:#9AA3AB; --line:#2A3035; --chip:#232A2E;
    --accent:#38C29F; --accent-soft:#143A31; --on-accent:#04201A;
    --danger:#FF8A73; --danger-fill:#E5553C; --danger-soft:#3B1E18; --on-danger:#FFFFFF; --opp:#6A2A20;
    --hp:#E5553C; --hp-soft:#3B1E18;
    --info:#86A6FF; --info-soft:#1D2949;
    --warn:#F2C46B; --warn-soft:#30260F; --warn-line:#6E5622; --warn-dot:#E0A63A;
    --t-red-bg:#3B1E18; --t-red:#FF9A85; --t-jade-bg:#143A31; --t-jade:#5FD3B2; --t-amber-bg:#33260E; --t-amber:#F2C46B;
    --t-gray-bg:#262C30; --t-gray:#AEB6BD; --t-blue-bg:#1D2949; --t-blue:#93B0FF; --t-purple-bg:#2B2140; --t-purple:#C3A6F5;
    --g-fan:#9AA0A6; --g-liang:#5CC27E; --g-shang:#86A6FF; --g-jue:#B592F0; --g-shen:#E5B64A; --g-jin:#FF7A66;
    --shadow:0 -6px 20px rgba(0,0,0,.35); --lift:0 8px 24px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    --ult-bg:rgba(14,17,19,.95); --ult-ink:#ECEFF1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113; --card:#191D20; --fg:#ECEFF1; --muted:#9AA3AB; --line:#2A3035; --chip:#232A2E;
  --accent:#38C29F; --accent-soft:#143A31; --on-accent:#04201A;
  --danger:#FF8A73; --danger-fill:#E5553C; --danger-soft:#3B1E18; --on-danger:#FFFFFF; --opp:#6A2A20;
  --hp:#E5553C; --hp-soft:#3B1E18;
  --info:#86A6FF; --info-soft:#1D2949;
  --warn:#F2C46B; --warn-soft:#30260F; --warn-line:#6E5622; --warn-dot:#E0A63A;
  --t-red-bg:#3B1E18; --t-red:#FF9A85; --t-jade-bg:#143A31; --t-jade:#5FD3B2; --t-amber-bg:#33260E; --t-amber:#F2C46B;
  --t-gray-bg:#262C30; --t-gray:#AEB6BD; --t-blue-bg:#1D2949; --t-blue:#93B0FF; --t-purple-bg:#2B2140; --t-purple:#C3A6F5;
  --g-fan:#9AA0A6; --g-liang:#5CC27E; --g-shang:#86A6FF; --g-jue:#B592F0; --g-shen:#E5B64A; --g-jin:#FF7A66;
  --shadow:0 -6px 20px rgba(0,0,0,.35); --lift:0 8px 24px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  --ult-bg:rgba(14,17,19,.95); --ult-ink:#ECEFF1;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:480px){#app{box-shadow:0 0 0 1px var(--line)}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,p{margin:0}
svg{display:block}

.appbar{flex-shrink:0;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.appbar h1{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance}
.appbar .sub{font-size:12px;color:var(--muted)}
.timepill{flex-shrink:0;height:32px;padding:0 12px;border-radius:16px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.timepill svg{color:var(--muted)}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}

.card{background:var(--card);border-radius:16px;padding:14px 16px}
.status{display:flex;align-items:center;gap:12px;padding:10px 14px}
.ava{position:relative;flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.ava.sq{border-radius:12px}
.ava .badge{position:absolute;right:-4px;bottom:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;border:2px solid var(--card);background:var(--fg);color:var(--card);font-size:10px;display:flex;align-items:center;justify-content:center}
.t-accent{background:var(--accent);color:var(--on-accent)}
.t-red{background:var(--t-red-bg);color:var(--t-red)} .t-jade{background:var(--t-jade-bg);color:var(--t-jade)}
.t-amber{background:var(--t-amber-bg);color:var(--t-amber)} .t-gray{background:var(--t-gray-bg);color:var(--t-gray)}
.t-blue{background:var(--t-blue-bg);color:var(--t-blue)} .t-purple{background:var(--t-purple-bg);color:var(--t-purple)}
.who{display:flex;flex-direction:column;flex-shrink:0}
.who b{font-size:15px} .who small{font-size:12px;color:var(--muted)}
.minibars{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted)}
.mb{display:flex;align-items:center;gap:6px}
.mb .tr{flex:1;height:5px;border-radius:3px;overflow:hidden;background:var(--hp-soft)}
.mb .tr i{display:block;height:100%;border-radius:3px;background:var(--hp);transition:width .35s}
.mb.mp .tr{background:var(--info-soft)} .mb.mp .tr i{background:var(--info)}
.mb.rage .tr{background:var(--accent-soft)} .mb.rage .tr i{background:var(--accent)}
.mb .v{min-width:28px;text-align:right;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.6;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.info{background:var(--info-soft);color:var(--info)} .tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.danger{background:var(--danger-soft);color:var(--danger)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.purple{background:var(--t-purple-bg);color:var(--t-purple)}
.tag.g-fan{color:var(--g-fan);background:color-mix(in srgb,var(--g-fan) 14%,transparent)}
.tag.g-liang{color:var(--g-liang);background:color-mix(in srgb,var(--g-liang) 14%,transparent)}
.tag.g-shang{color:var(--g-shang);background:color-mix(in srgb,var(--g-shang) 14%,transparent)}
.tag.g-jue{color:var(--g-jue);background:color-mix(in srgb,var(--g-jue) 14%,transparent)}
.tag.g-shen{color:var(--g-shen);background:color-mix(in srgb,var(--g-shen) 16%,transparent)}
.tag.g-jin{color:var(--g-jin);background:color-mix(in srgb,var(--g-jin) 14%,transparent)}

.quest{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 12px;border-radius:14px;text-align:left;width:100%}
.quest .qt{flex:1;min-width:0;font-size:14px;font-weight:500}
.quest .qd{font-size:12px;color:var(--muted);white-space:nowrap}
.quest svg{color:var(--muted);flex-shrink:0}

.scene{display:flex;flex-direction:column;gap:10px}
.desc{font-size:15px;line-height:1.75}
.feed{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.fr{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);line-height:1.6}
.fr .tag{margin-top:1px}
.fr.new{animation:fin .45s ease-out}

.here{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:6px}
.sec-h h2{font-size:15px;font-weight:700}
.sec-h .count{font-size:13px;color:var(--muted)}
.avas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.avab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;min-height:44px;min-width:0}
.avab .nm{font-size:12px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.avab[aria-pressed="true"] .ava{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.avab[aria-pressed="true"] .nm{color:var(--accent);font-weight:700}
.detail{display:flex;flex-direction:column;gap:10px}
.d-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-h b{font-size:15px}
.d-h small{margin-left:auto;font-size:12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.act{height:44px;border-radius:12px;background:var(--chip);font-size:14px;font-weight:500}
.act.danger{background:var(--danger-soft);color:var(--danger)}
.act.strong{background:var(--danger-fill);color:var(--on-danger);font-weight:700}
.act.spar{background:var(--accent-soft);color:var(--accent);font-weight:700}
.reply{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.75;animation:fin .3s ease-out}

.go{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.go h2{font-size:15px;font-weight:700}
.exits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.exit{min-height:52px;padding:8px 12px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.exit.solo{grid-column:1 / -1}
.dir{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.exit .en{display:flex;flex-direction:column;min-width:0}
.exit .en b{font-size:14px;font-weight:500}
.exit .en small{font-size:11px;color:var(--muted)}
.exit .tag{margin-left:auto}

.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card)}
.tab{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.muted{color:var(--muted);font-size:13px;line-height:1.7}
.attrs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.attr{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0;border-radius:12px;background:var(--chip);min-width:0}
.attr b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.attr span{font-size:12px;font-weight:500}
.attr small{font-size:10px;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.kv div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0;padding-top:2px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item .ii{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .ii b{font-size:15px}
.item .ii p{font-size:13px;color:var(--muted);line-height:1.6}
.item .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.use{height:44px;padding:0 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;flex-shrink:0}
.use:disabled{opacity:.45}
.sk-card{display:flex;flex-direction:column;gap:8px}
.sk-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk-h b{font-size:16px;margin-right:2px}
.realm{display:flex;justify-content:space-between;align-items:baseline}
.realm span{font-weight:700;color:var(--accent);font-size:14px}
.realm small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tr2{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.tr2 i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s}
.sk-d{font-size:14px;line-height:1.75}
.moves,.grades{display:flex;flex-wrap:wrap;gap:6px}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.map{position:relative;height:330px;border-radius:16px;background:var(--card);overflow:hidden}
.map .ln{position:absolute;background:var(--line)}
.node{position:absolute;transform:translate(-50%,-50%);min-height:44px;padding:0 14px;border-radius:22px;background:var(--chip);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.node.here{background:var(--accent);color:var(--on-accent);font-weight:700}
.node .qdot{width:8px;height:8px;border-radius:50%;background:var(--info)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.travel{position:absolute;left:16px;right:16px;bottom:72px;z-index:15;padding:12px 14px;border-radius:14px;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;gap:6px;box-shadow:var(--lift);animation:fin .2s ease-out}
.travel b{font-size:14px}
.travel small{font-size:13px;opacity:.8}
.travel .tb{height:3px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.travel .tb i{display:block;height:100%;background:var(--bg);animation:grow .75s linear forwards}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--lift);animation:tin .2s ease-out;text-align:center}

#sheetLayer{position:absolute;inset:0;z-index:45}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .2s}
.panel{width:100%;max-height:90%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:22px 16px 18px;display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.r-h{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.r-h h2{font-size:22px;font-weight:900;line-height:1.3}
.r-sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px}
.story{font-family:var(--f-serif);font-weight:600;font-size:16px;line-height:1.95;text-indent:2em}
.statline{font-size:12px;color:var(--muted)}
.rewards{display:flex;flex-wrap:wrap;gap:6px}
.news{display:flex;flex-direction:column;gap:8px}
.news div{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.7}
.news .tag{margin-top:2px}
.btn{height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;width:100%}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.warn{background:var(--danger-fill);color:var(--on-danger)}

#fightLayer{position:absolute;inset:0;z-index:20}
.fight{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:fade .25s}
.f-top{flex-shrink:0;padding:8px 8px 4px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.f-where{display:flex;align-items:center;gap:8px}
.f-where .pl{font-size:15px;font-weight:700}
.f-r{display:flex;align-items:center;gap:2px}
.pill{height:26px;padding:0 10px;border-radius:13px;background:var(--card);font-size:12px;font-weight:500;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.foecard{flex-shrink:0;margin:0 16px;display:flex;align-items:center;gap:12px;padding:12px 14px}
.foecard .ava{width:48px;height:48px;font-size:18px}
.foe-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.foe-n{display:flex;align-items:baseline;gap:8px}
.foe-n b{font-size:17px}
.foe-n small{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-height:20px}
.hpbar{display:flex;align-items:center;gap:8px}
.hpbar .tr{flex:1;height:6px;border-radius:3px;background:var(--hp-soft);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp);border-radius:3px;transition:width .4s}
.hpbar span{font-size:12px;font-weight:700;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.hpbar.flash .tr{animation:flash .3s}
.body{color:var(--muted);flex-shrink:0}
.body .wd{fill:var(--hp);stroke:none}
.mom{flex-shrink:0;padding:10px 16px 6px;display:flex;flex-direction:column;gap:6px}
.mom-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.mom-l .me{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.mom-l .op{color:var(--danger);font-weight:700;font-variant-numeric:tabular-nums}
.mom-l .st{color:var(--muted)}
.mom-b{display:flex;gap:2px;height:8px}
.mom-b i{display:block;flex-basis:0;transition:flex-grow .4s}
.mom-b .m1{background:var(--accent);border-radius:4px 0 0 4px}
.mom-b .m2{background:var(--opp);border-radius:0 4px 4px 0}
.flog-wrap{position:relative;flex:1;min-height:0}
.flog{position:absolute;inset:0;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.flog::before{content:'';margin-top:auto}
.b{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.65;animation:bin .22s ease-out}
.b.foe{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.b.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.b.old{color:var(--muted)}
.b.crit{box-shadow:inset 0 0 0 1.5px var(--accent)}
.b.tell{align-self:flex-start;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-line);border-bottom-left-radius:4px;font-weight:700}

function bubble(type, html, dmg, kind) {
  const log = $('#flog'); if (!log) return;
  const d = document.createElement('div'); d.className = 'b ' + type;
  d.innerHTML = html + (dmg ? `<span class="dmg ${kind || 'out'}">${kind === 'heal' ? '+' : '−'}${Math.round(dmg)}</span>` : '');
  log.appendChild(d);
  const k = log.querySelectorAll('.b.me,.b.foe'); k.forEach((el, i) => el.classList.toggle('old', i < k.length - 3));
  while (log.children.length > 46) log.removeChild(log.firstElementChild);
  log.scrollTop = log.scrollHeight;
}
function next(ms) { if (!C || C.over) return; clearTimeout(C.T.tick); C.T.tick = setTimeout(tick, ms || (C.phase === 2 ? 1300 : ROUND_MS)); }
function tick() {
  if (!C || C.over || C.paused || C.prompt || C.busy) return;

  if (C.gu > 0) C.gu--;
  if (C.jh > 0) C.jh--;
  C.nextTell--;
  if (C.nextTell <= 0) { startTell(); updAll(); return; }
  if (Math.random() < 0.26 + C.mom * 0.0048) playerAuto(); else foeAuto();
  if (!C.over && Math.random() < 0.1) bubble('aside', pick(C.f.asides));
  updAll(); next();
}
function chargeMul() { const m = 1 + C.charge; C.charge = 0; return m; }
function cancelCharge() { if (!C) return; C.chargeT = 0; const b = $('#skCharge'); if (b) b.classList.remove('charging'); }

  const r = Math.random(), dg = 0.14 - (C.mom - 50) * 0.002, pr = 0.2 - (C.mom - 50) * 0.002;
  if (r < dg) bubble('me', t + pick(FOE_DODGE)(f));
  else if (r < dg + pr) bubble('me', t + pick(FOE_PARRY)(f));
  else {
    let d = rnd(55, 80) * chargeMul(); const crit = Math.random() < 0.1;
    if (crit) d *= 1.6;
    bubble('me', t + pick(FOE_HIT)(f, p) + (crit ? '<span class="note">剑势如虹</span>' : ''), d, 'out');

}

function endFight(res) {
  if (!C || C.over) return;
  C.over = true; C.res = res;
  clearTimeout(C.T.tick); clearTimeout(C.T.prompt); clearTimeout(C.T.open); clearInterval(C.T.cd);
  C.prompt = null; C.opening = null; hideOpening(); setPromptUI(false); cancelCharge();
  if (res === 'win') bubble('foe', C.f.win);
  else if (res === 'lose') bubble('sys', C.f.lose);
  updAll();
  setTimeout(showResult, reduce ? 300 : 1300);
}
function composeStory() {
  const st = C.st, parts = [];
  parts.push(`话说${dateStr()}${shichen(S.min)}，扬州运河渡口细雨蒙蒙。黑风寨主屠千山正指挥喽啰卸货，忽有一位青衫少年按剑而来，拦在码头当中。`);
  if (st.big.length) parts.push(`那屠千山的${st.big.map(x => '「' + x + '」').join('、')}何等凶猛，少年却${st.parry ? liang(st.parry) + '次见招拆招，教他占不到半分便宜' : '硬是咬牙撑了下来'}。`);
  if (st.open) parts.push(`更有${liang(st.open)}次瞧出破绽，趁虚而入。`);
  if (st.ult) parts.push('最后一剑「断水」，剑气横江，满江雨幕为之一断——');
  parts.push(`两人斗到第${cn(C.round)}合，屠千山终于弃刀跪倒。`);
  parts.push('此事一传十、十传百，扬州城里人人都在打听：这位少年，究竟是什么来头？');
  return parts.join('');
}
function showResult() {
  if (!C) return;
  const f = C.f, res = C.res, st = C.st;
  const statline = `<p class="statline">共 ${C.round} 合 · 见招拆招得手 ${st.parry} 次 · 破绽 ${st.open} 次 · 断水 ${st.ult} 次</p>`;
  let html = '';
  const growth = `<div class="r-sub">变强之道</div><div class="news">
      <div><span class="tag accent">闭关</span><span>境界越高，火候越足，见招拆招的成算越高。</span></div>
      <div><span class="tag accent">请教</span><span>小金山的棋痴能点拨「惊鸿剑」，抢攻会更有把握。</span></div>
      <div><span class="tag accent">问道</span><span>大明寺的了尘大师见多识广，不妨去请教。</span></div></div>`;
  advanceMin(15);
  if (!f.spar && res === 'win') {
    const story = composeStory(); S.story = story;
    S.flags.boss = true; S.quest = 2; S.title = '渡口一剑'; S.silver += 200; S.items.blade = 1; S.xia += 20;
    const br = gainProf('hanjiang', 300);
    pushFeed('江湖', '有人在运河渡口斗败了黑风寨主屠千山，江湖人称「渡口一剑」。');
    html = `<div class="r-h"><span class="tag danger">首领战 · 胜</span><h2>大败黑风寨主</h2></div>
      <div class="r-sub">战后说书</div><p class="story">${story}</p>${statline}
      <div class="rewards"><span class="tag accent">寒江剑法 熟练 +300</span>${br.map(x => `<span class="tag info">${x}</span>`).join('')}<span class="tag accent">侠义 +20</span><span class="tag accent">银两 +200 文</span><span class="tag accent">获得 黑风断首刀</span><span class="tag purple">名号「渡口一剑」</span></div>
      <button class="btn" data-act="resultClose">收下，回到渡口</button>`;
  } else if (!f.spar && res === 'lose') {
    S.loc = 'daming'; S.hp = Math.round(S.hpMax * 0.4); const lost = Math.min(30, S.silver); S.silver -= lost;
    pushFeed('江湖', '你在渡口落败，被船夫送到了大明寺。');
    html = `<div class="r-h"><span class="tag">首领战 · 负</span><h2>败走渡口</h2></div>
      <p class="story">你醒来时，已躺在大明寺的禅房里。了尘大师说，是渡口的船夫冒雨把你背上了蜀冈。窗外钟声悠悠，你摸了摸胸口的伤，心里只想着一件事：以眼下的修为，那几刀究竟该怎么接？</p>${statline}${growth}
      <div class="rewards"><span class="tag">气血恢复至四成</span><span class="tag danger">银两 −${lost} 文</span></div>
      <button class="btn" data-act="resultClose">起身</button>`;
  } else if (!f.spar && res === 'flee') {
    S.loc = 'hu';
    html = `<div class="r-h"><span class="tag">首领战</span><h2>暂避锋芒</h2></div>
      <p class="story">你借着漕船脱身，绕了一大圈才回到瘦西湖畔。身后隐约还能听见屠千山的骂声。留得青山在，不怕没柴烧。</p>${statline}
      <button class="btn" data-act="resultClose">回到湖畔</button>`;
  } else {
    const won = res === 'win';
    if (S.rel.liu !== '心存芥蒂') S.rel.liu = '不打不相识';
    const br = gainProf('hanjiang', won ? 80 : 40);
    html = `<div class="r-h"><span class="tag accent">切磋 · ${won ? '胜' : '负'}</span><h2>${won ? '略胜一筹' : '棋差一着'}</h2></div>
      <p class="story">${won ? '柳寒舟收剑入伞，笑道：「兄台的剑，比你的人还要冷。改日渡口若有事，柳某也想去看看热闹。」' : '柳寒舟收剑入伞：「兄台底子不差，只是火候未到。我出重手时，你该挑自己最有把握的法子应对，而不是最好看的。」'}</p>${statline}
      <div class="rewards"><span class="tag accent">寒江剑法 熟练 +${won ? 80 : 40}</span>${br.map(x => `<span class="tag info">${x}</span>`).join('')}<span class="tag">柳寒舟 · 不打不相识</span></div>${won ? '' : growth}
      <button class="btn" data-act="resultClose">回到湖畔</button>`;
  }
  save();
  openSheet(html);
}
function closeFight() {
  closeSheet();
  if (C) { clearTimeout(C.T.tick); clearTimeout(C.T.prompt); clearTimeout(C.T.open); clearInterval(C.T.cd); }
  C = null; const L = $('#fightLayer'); L.hidden = true; L.innerHTML = '';
  S.sel = null; S.reply = null; render(); $('#main').scrollTop = 0;
}

/* ---------- events ---------- */
const handlers = {
  tab: v => { S.tab = v; S.confirmRestart = false; render(); $('#main').scrollTop = 0; },
  sel: v => { S.sel = v; S.reply = null; render(); },
  do: v => doAct(v),
  travel: v => travelTo(v),
  quest: () => { const q = QUEST[S.quest]; if (q.to && q.to !== S.loc) travelTo(q.to); else toast('就在此处'); },
  use: () => { if (S.items.jcy < 1 || S.hp >= S.hpMax) return; S.items.jcy--; S.hp = Math.min(S.hpMax, S.hp + 260); toast('气血回复'); render(); },
  retreat: v => retreat(v),
  sheetClose: () => { closeSheet(); render(); },
  restart: () => { S.confirmRestart = true; render(); },
  restartNo: () => { S.confirmRestart = false; render(); },
  restartYes: () => { S = freshState(); render(); toast('已从头再来'); },
  sk: v => useSkill(v),
  react: v => { if (C && C.prompt) resolveTell(v); },
  opening: () => takeOpening(),
  pause: () => pauseFight(),
  resume: () => resumeFight(),
  resultClose: () => closeFight()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, i = a.indexOf(':');
  const k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  if (handlers[k]) handlers[k](v, el);
});

/* ---------- boot ---------- */
function start(data) {
  S = (data && data.S) || load() || freshState();
  S.confirmRestart = false;
  if (!S.attr) S.attr = Object.assign({}, ATTR0);
  buildShell(); render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
